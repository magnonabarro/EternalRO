//--------------------------------------------------------------
// Easycore Works - Configuration File
//--------------------------------------------------------------
// Note 1: Value is a config switch (on/off, yes/no or 1/0)
// Note 2: Value is in percents (100 means 100%)
// Note 3: Value is a bit field. If no description is given,
//         assume unit types (1: Pc, 2: Mob, 4: Pet, 8: Homun, 16: Mercenary, 128: NPC, 512: Elemental)
//--------------------------------------------------------------

// Extended Vending System [Lilith]
// Enable or disable extended vending system? (Note 1)
extended_vending: on

// Broadcast the currency used when opening the vending board.
show_broadcast_info: on

// Show the currency name in the vending title.
show_item_vending: on

// Show transaction information to the vendor.
ex_vending_info: on

// Send a sales report to the vendor mailbox.
// Set permanent player variable NOVREPORT to 1 to disable reports for a player.
ex_vending_report: on

// Allow purchases using bound currency items.
// WARNING: Only enable this if the server rules allow bound currency transfer.
ex_buying_bound: on

// Item IDs representing the virtual Zeny/Cash currencies.
item_zeny: 30000
item_cash: 30001
