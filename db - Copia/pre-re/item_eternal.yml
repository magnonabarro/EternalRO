  - Id: 40727
    AegisName: Refine_Box_6
    Name: Caixa de Refino Nivel 6
    Type: Usable
    Weight: 10
    Flags:
      Container: true
    Script: |
      // Os pesos restantes somam 92 apos remover os dois itens Super.
      // O sorteio usa esses pesos relativos, totalizando 100% de chance.
      .@r = rand(92);
      if (.@r < 30) {
        getitem 6439,5; // Mega-Elunium
      } else if (.@r < 60) {
        getitem 6438,5; // Omni-Oridecon
      } else if (.@r < 80) {
        getitem 6635,15; // Bencao do Ferreiro
      } else if (.@r < 83) {
        getitem 6993,1; // Pergaminho de Arma +10
      } else if (.@r < 86) {
        getitem 6994,1; // Pergaminho de Armadura +10
      } else if (.@r < 88) {
        getitem 6238,1; // Pergaminho de Arma +11
      } else if (.@r < 90) {
        getitem 6239,1; // Pergaminho de Armadura +11
      } else if (.@r < 91) {
        getitem 6584,1; // Pergaminho de Arma +12
      } else {
        getitem 6585,1; // Pergaminho de Armadura +12
      }
